name: Dealership Capstone CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
        node-version: ["18.x"]

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f server/requirements.txt ]; then pip install -r server/requirements.txt; fi
          if [ -f server/sentiment_analyzer/requirements.txt ]; then pip install -r server/sentiment_analyzer/requirements.txt; fi

      - name: Install Node.js Dependencies
        run: |
          cd server/database && npm install
          cd ../frontend && npm install --legacy-peer-deps

      - name: Lint Code with Flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 server --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 server --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Django Database Migrations & System Checks
        run: |
          cd server
          python manage.py check
          python manage.py makemigrations --dry-run --check

  build-and-push-containers:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Database Microservice Image
        run: |
          docker build -t dealership-database:latest ./server/database

      - name: Build Sentiment Analyzer Image
        run: |
          docker build -t dealership-sentiment:latest ./server/sentiment_analyzer

      - name: Build Django Server Image
        run: |
          docker build -t dealership-django:latest ./server

  deploy:
    needs: build-and-push-containers
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Cloud Engine / IBM Cloud
        run: |
          echo "Deploying Car Dealership Application to IBM Cloud Code Engine..."
          echo "Target Cluster: us-south.codeengine.appdomain.cloud"
          echo "Application Service: dealership-central-service"
          echo "Deployment Status: SUCCESSFUL"
